---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/phones_app/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/data
    - /bin/mkdir -p $DEPLOYPATH/uploads
    - /bin/mkdir -p $DEPLOYPATH/public/uploads
    - /bin/mkdir -p $DEPLOYPATH/tmp
    - /bin/cp -Rf app.js $DEPLOYPATH
    - /bin/cp -Rf app.cjs $DEPLOYPATH
    - /bin/cp -Rf server.ts $DEPLOYPATH
    - /bin/cp -Rf package.json $DEPLOYPATH
    - /bin/cp -Rf index.html $DEPLOYPATH
    - /bin/cp -Rf cpanel_build $DEPLOYPATH
    - /bin/cp -Rf public $DEPLOYPATH
    - /bin/cp -Rf src $DEPLOYPATH
    - /bin/mkdir -p $HOME/public_html/assets
    - /bin/mkdir -p $HOME/public_html/admin
    - /bin/mkdir -p $HOME/public_html/uploads
    - /bin/mkdir -p $HOME/public_html/api
    - /bin/cp -Rf cpanel_build/index.html $HOME/public_html/index.html
    - /bin/cp -Rf public/assets/* $HOME/public_html/assets/
    - /bin/cp -Rf cpanel_build/assets/* $HOME/public_html/assets/
    - /bin/cp -Rf cpanel_build/admin/* $HOME/public_html/admin/
    - /bin/cp -Rf public/api/index.php $HOME/public_html/api/index.php
    - /bin/cp -Rf public/api/.htaccess $HOME/public_html/api/.htaccess
    - /bin/cp -Rf cpanel_build/seed-database.json $HOME/public_html/api/seed-database.json
    - /bin/touch $DEPLOYPATH/tmp/restart.txt

